networks:
  reverse-proxy:
    external: true

services:
  airtrail:
    image: docker.io/johly/airtrail:v3.12.0
    container_name: airtrail
    networks:
      - reverse-proxy
    environment:
      DB_URL: postgres://user:password@airtrail-postgres:5432/airtrail
    labels:
      traefik.enable: true
      traefik.http.routers.airtrail.entrypoints: websecure
      traefik.http.routers.airtrail.rule: Host(`airtrail.${DOMAIN_NAME}`)
      traefik.http.routers.airtrail.middlewares: chain-authentik@file
      traefik.http.services.airtrail.loadbalancer.server.port: 3000
    depends_on:
      airtrail-postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      disable: true
    deploy:
      restart_policy:
        condition: unless-stopped
      resources:
        limits:
          cpus: '0.1'
          memory: 256M
        reservations:
          cpus: '0.01'
          memory: 128M

  airtrail-postgres:
    image: docker.io/library/postgres:18.6-alpine
    container_name: airtrail-postgres
    networks:
      - reverse-proxy
    volumes:
      - ~/home-server/airtrail-postgres:/var/lib/postgresql:rw
    environment:
      POSTGRES_DB: airtrail
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: unless-stopped
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
        reservations:
          cpus: '0.01'
          memory: 128M
