# TCP routers to the Kubernetes cluster. HTTPS for davydehaas.dev no longer passes through here: the router forwards 80
# and 443 to the cluster's Envoy gateway, which passes davydehaas.nl through to this Traefik.
tcp:
  routers:
    # MQTT (no TLS) to the cluster's mosquitto, so clients keep using this host's port 1883
    mqtt:
      entryPoints:
        - mqtt
      rule: HostSNI(`*`)
      service: mqtt-service

  services:
    mqtt-service:
      loadBalancer:
        servers:
          - address: 192.168.1.57:1883   # mosquitto LB IP (Cilium LB-IPAM)
