name: Terraform Cloudflare davydehaas.dev

on:
  push:
    branches:
      - main
    paths:
      - "_terraform/cloudflare/davydehaas.dev/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "terraform apply"
        required: false
        type: boolean
        default: false

jobs:
  terraform-cloudflare-davydehaas-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: _terraform/cloudflare/davydehaas.dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-state-cloudflare-dev
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "v1.16.4"

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_ipv4_address: ${{ secrets.SERVER_IPV4_ADDRESS }}
          TF_VAR_ipv6_address: ${{ secrets.SERVER_IPV6_ADDRESS }}

      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_ipv4_address: ${{ secrets.SERVER_IPV4_ADDRESS }}
          TF_VAR_ipv6_address: ${{ secrets.SERVER_IPV6_ADDRESS }}
